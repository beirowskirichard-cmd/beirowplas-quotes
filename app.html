<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/><title>Beirowplas Quotes</title><style>:root{--bg:#071912;--card:#0f2c22;--card2:#14362b;--line:#1f4a3a;--text:#e8f5ef;--muted:#9bb8ab;--accent:#2ecc71;--ok:#27ae60}*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,sans-serif}body{padding-bottom:88px}header{position:sticky;top:0;background:#0b3d2e;padding:14px 16px}header h1{margin:0;font-size:18px}header p{margin:3px 0 0;color:var(--muted);font-size:12px}.wrap{padding:14px}.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px}h2{margin:0 0 8px;font-size:15px}label{display:block;font-size:12px;color:var(--muted);margin:10px 0 4px}input,textarea{width:100%;background:#0a211a;color:var(--text);border:1px solid var(--line);border-radius:10px;padding:11px 12px;font-size:16px}.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}.btn{width:100%;border:0;border-radius:12px;padding:13px;font-weight:700}.btn-main{background:var(--accent);color:#062016}.btn-ghost{background:var(--card2);color:var(--text);border:1px solid var(--line)}.btn-row{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}.kpi{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:10px}.kpi div{background:var(--card2);border-radius:12px;padding:10px}.kpi span{display:block;font-size:11px;color:var(--muted)}.kpi b{font-size:18px}.profit{color:var(--ok)}.table{width:100%;font-size:13px;border-collapse:collapse}.table td{padding:7px 0;border-bottom:1px solid var(--line)}.table td:last-child{text-align:right}.check{display:flex;gap:8px;margin-top:12px;align-items:center}.check input{width:auto}.hidden{display:none}.qitem{background:var(--card2);border-radius:12px;padding:10px;margin-bottom:8px}nav{position:fixed;left:0;right:0;bottom:0;display:grid;grid-template-columns:1fr 1fr 1fr;background:#0a2a20}nav button{background:none;border:0;color:var(--muted);padding:14px 8px 18px}nav button.active{color:var(--accent);font-weight:700}.note{font-size:12px;color:var(--muted)}</style></head><body><header><h1>Beirowplas Quotes</h1><p>Same formulas as your Excel</p></header><section id="page-quote" class="wrap"><div class="card"><h2>Job inputs</h2><label>Client</label><input id="client"/><div class="row"><div><label>Trip km (Excel uses this as-is)</label><input id="km" type="number" step="0.1" value="60"/></div><div><label>Driving hours</label><input id="drive" type="number" step="0.1" value="1.5"/></div></div><div class="row"><div><label>Handling hours</label><input id="handle" type="number" step="0.1" value="1"/></div><div><label>Diesel R/L</label><input id="diesel" type="number" step="0.01" value="27.34"/></div></div><div class="row"><div><label>Markup % on ops (Excel 60)</label><input id="margin" type="number" value="60"/></div><div><label>Loads</label><input id="loads" type="number" value="1"/></div></div><div class="row"><div><label>Extra 30-min standing</label><input id="stand" type="number" value="0"/></div><div><label>Dumping tons</label><input id="tons" type="number" step="0.1" value="0"/></div></div><label class="check"><input id="truckOnly" type="checkbox" checked/> Truck only (uses R51,000/mo fixed)</label><label>Notes</label><textarea id="notes"></textarea><div class="btn-row"><button class="btn btn-main" onclick="saveQuote()">Save quote</button><button class="btn btn-ghost" onclick="calc()">Calculate</button></div></div><div class="card"><h2>True internal cost</h2><div class="kpi"><div><span>Cost excl diesel</span><b id="kEx">R 0</b></div><div><span>Diesel</span><b id="kD">R 0</b></div><div><span>All-in cost</span><b id="kIn">R 0</b></div><div><span>Profit on quote</span><b id="kP" class="profit">R 0</b></div></div><table class="table" id="brk"></table></div><div class="card"><h2>Client quote (Excel invoice)</h2><table class="table" id="qtab"></table><p class="note" id="check"></p><div class="btn-row"><button class="btn btn-main" onclick="whatsapp()">WhatsApp</button><button class="btn btn-ghost" onclick="copyMsg()">Copy</button></div></div></section><section id="page-jobs" class="wrap hidden"><div class="card"><h2>Saved quotes</h2><div id="jobs"></div></div></section><section id="page-rates" class="wrap hidden"><div class="card"><h2>Rates</h2><div class="row"><div><label>Driver R/hr</label><input id="rDriver" type="number"/></div><div><label>Achterrijder R/hr</label><input id="rHelper" type="number"/></div></div><div class="row"><div><label>Fixed + trailer</label><input id="rFixT" type="number"/></div><div><label>Fixed truck only</label><input id="rFixO" type="number"/></div></div><div class="row"><div><label>Hours / month</label><input id="rHrs" type="number"/></div><div><label>Service R/km</label><input id="rServ" type="number"/></div></div><div class="row"><div><label>Truck tyre R/km</label><input id="rTire" type="number"/></div><div><label>Trailer tyre R/km</label><input id="rTrail" type="number"/></div></div><div class="row"><div><label>Other / load</label><input id="rOther" type="number"/></div><div><label>km per litre</label><input id="rKpl" type="number"/></div></div><div class="row"><div><label>Standing / 30 min</label><input id="rStand" type="number"/></div><div><label>Dumping / ton</label><input id="rDump" type="number"/></div></div><div class="row"><div><label>VAT %</label><input id="rVat" type="number"/></div><div><label>Licensing / year</label><input id="rLic" type="number"/></div></div><div class="btn-row"><button class="btn btn-main" onclick="saveRates()">Save rates</button><button class="btn btn-ghost" onclick="resetRates()">Reset</button></div></div></section><nav><button class="active" onclick="show('quote',this)">Quote</button><button onclick="show('jobs',this)">Jobs</button><button onclick="show('rates',this)">Rates</button></nav><script>var DEF={driver:87.5,helper:37.5,fixTrailer:15000,fixOnly:51000,hours:176,licYear:7000,serv:0.75,tire:1.2,trail:0.4,other:150,kpl:1.9,stand:550,dump:742.4,vat:15};var KEY_R='bp_excel_rates_v2',KEY_Q='bp_excel_quotes_v2',last=null,editingId=null;function $(i){return document.getElementById(i)}function nn(i){return parseFloat($(i).value)||0}function money(x){return 'R '+Math.round(x).toLocaleString('en-ZA')}function getStore(k){try{return localStorage.getItem(k)}catch(e){return null}}function setStore(k,v){try{localStorage.setItem(k,v)}catch(e){}}function rates(){try{return Object.assign({},DEF,JSON.parse(getStore(KEY_R)||'{}'))}catch(e){return Object.assign({},DEF)}}function fillRates(){var r=rates();['rDriver','rHelper','rFixT','rFixO','rLic','rHrs','rServ','rTire','rTrail','rOther','rKpl','rStand','rDump','rVat'].forEach(function(){});$('rDriver').value=r.driver;$('rHelper').value=r.helper;$('rFixT').value=r.fixTrailer;$('rFixO').value=r.fixOnly;$('rLic').value=r.licYear;$('rHrs').value=r.hours;$('rServ').value=r.serv;$('rTire').value=r.tire;$('rTrail').value=r.trail;$('rOther').value=r.other;$('rKpl').value=r.kpl;$('rStand').value=r.stand;$('rDump').value=r.dump;$('rVat').value=r.vat}function saveRates(){setStore(KEY_R,JSON.stringify({driver:nn('rDriver'),helper:nn('rHelper'),fixTrailer:nn('rFixT'),fixOnly:nn('rFixO'),licYear:nn('rLic'),hours:nn('rHrs')||176,serv:nn('rServ'),tire:nn('rTire'),trail:nn('rTrail'),other:nn('rOther'),kpl:nn('rKpl')||1.9,stand:nn('rStand'),dump:nn('rDump'),vat:nn('rVat')}));alert('Rates saved');calc()}function resetRates(){setStore(KEY_R,JSON.stringify(DEF));fillRates();calc()}function compute(){var r=rates(),km=nn('km'),drive=nn('drive'),handle=nn('handle'),diesel=nn('diesel'),margin=nn('margin'),loads=nn('loads')||1,stand=nn('stand'),tons=nn('tons'),only=$('truckOnly').checked,hours=drive+handle,labor=hours*(r.driver+r.helper)*loads,monthly=only?r.fixOnly:r.fixTrailer,fixed=(monthly/(r.hours||176))*hours,perKm=r.serv+r.tire+r.trail,kmCost=km*perKm,other=r.other*loads,litres=km/(r.kpl||1.9),dieselR=litres*diesel,excl=labor+fixed+kmCost+other,incl=excl+dieselR,transport=excl*(1+margin/100),standing=stand*r.stand,dumping=tons*r.dump,sub=transport+dieselR+standing+dumping,vat=sub*(r.vat/100),total=sub+vat;return{client:$('client').value||'Unnamed',notes:$('notes').value,km:km,drive:drive,handle:handle,hours:hours,diesel:diesel,margin:margin,loads:loads,stand:stand,tons:tons,only:only,labor:labor,fixed:fixed,kmCost:kmCost,other:other,litres:litres,dieselR:dieselR,excl:excl,incl:incl,transport:transport,standing:standing,dumping:dumping,sub:sub,vat:vat,total:total,profit:sub-incl,perKm:perKm,monthly:monthly}}function calc(){last=compute();var c=last;$('kEx').textContent=money(c.excl);$('kD').textContent=money(c.dieselR);$('kIn').textContent=money(c.incl);$('kP').textContent=money(c.profit);$('brk').innerHTML='<tr><td>Labour '+c.hours+'h</td><td>'+money(c.labor)+'</td></tr><tr><td>Fixed '+money(c.monthly)+'/mo</td><td>'+money(c.fixed)+'</td></tr><tr><td>Service+tyres '+c.km+'km x R'+c.perKm.toFixed(2)+'</td><td>'+money(c.kmCost)+'</td></tr><tr><td>Other</td><td>'+money(c.other)+'</td></tr><tr><td>Diesel '+c.litres.toFixed(1)+'L</td><td>'+money(c.dieselR)+'</td></tr>';$('qtab').innerHTML='<tr><td>Transport (ops + '+c.margin+'% markup)</td><td>'+money(c.transport)+'</td></tr><tr><td>Diesel recovery</td><td>'+money(c.dieselR)+'</td></tr><tr><td>Standing</td><td>'+money(c.standing)+'</td></tr><tr><td>Dumping</td><td>'+money(c.dumping)+'</td></tr><tr><td>Excl VAT</td><td>'+money(c.sub)+'</td></tr><tr><td>VAT</td><td>'+money(c.vat)+'</td></tr><tr><td><b>Total incl VAT</b></td><td><b>'+money(c.total)+'</b></td></tr>';$('check').textContent='Excel check at 60km / 2.5h / R27.34 / truck only / 60%: cost R2,191 · quote excl R2,988 · incl VAT R3,436'}function msgFrom(c){return '*BEIROWPLAS QUOTE*\n'+c.client+'\n'+c.km+' km · '+c.hours+' h\nTransport '+money(c.transport)+'\nDiesel '+money(c.dieselR)+'\nExcl VAT '+money(c.sub)+'\n*Total incl VAT '+money(c.total)+'*\nRichard 072 511 5922'}function whatsapp(){if(!last)calc();window.open('https://wa.me/?text='+encodeURIComponent(msgFrom(last)))}function copyMsg(){if(!last)calc();try{navigator.clipboard.writeText(msgFrom(last));alert('Copied')}catch(e){alert(msgFrom(last))}}function quotes(){try{return JSON.parse(getStore(KEY_Q)||'[]')}catch(e){return []}}function saveQuote(){calc();var all=quotes();last.at=new Date().toLocaleString('en-ZA');if(editingId){last.id=editingId;all=all.map(function(q){return q.id===editingId?last:q});editingId=null;alert('Updated')}else{last.id=Date.now();all.unshift(last);alert('Saved')}setStore(KEY_Q,JSON.stringify(all.slice(0,80)));renderJobs()}function editQ(id){var q=quotes().filter(function(x){return x.id===id})[0];if(!q)return;editingId=id;$('client').value=q.client||'';$('km').value=q.km||0;$('drive').value=q.drive||0;$('handle').value=q.handle||0;$('diesel').value=q.diesel||0;$('margin').value=q.margin||60;$('loads').value=q.loads||1;$('stand').value=q.stand||0;$('tons').value=q.tons||0;$('truckOnly').checked=!!q.only;$('notes').value=q.notes||'';calc();show('quote',document.querySelector('nav button'))}function renderJobs(){var all=quotes();$('jobs').innerHTML='<div class="btn-row"><button class="btn btn-ghost" onclick="exportBak()">Backup file</button><button class="btn btn-ghost" onclick="document.getElementById(\x27imp\x27).click()">Restore</button></div><input id="imp" type="file" accept="application/json" class="hidden" onchange="importBak(event)">'+ (all.length?all.map(function(q){return '<div class="qitem"><b>'+q.client+'</b> · '+money(q.total)+'<br><small>'+q.at+'</small><div class="btn-row"><button class="btn btn-ghost" onclick="editQ('+q.id+')">Edit</button><button class="btn btn-main" onclick="waQ('+q.id+')">WhatsApp</button></div><button class="btn btn-ghost" style="margin-top:8px" onclick="delQ('+q.id+')">Delete</button></div>'}).join(''):'<p class="note">No quotes yet</p>')}function exportBak(){var a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify({rates:rates(),quotes:quotes()},null,2)],{type:'application/json'}));a.download='beirowplas-quotes-backup.json';a.click()}function importBak(ev){var f=ev.target.files[0];if(!f)return;var r=new FileReader();r.onload=function(){try{var d=JSON.parse(r.result);if(d.rates)setStore(KEY_R,JSON.stringify(d.rates));if(d.quotes)setStore(KEY_Q,JSON.stringify(d.quotes));fillRates();renderJobs();calc();alert('Restored')}catch(e){alert('Bad file')}};r.readAsText(f)}function delQ(id){setStore(KEY_Q,JSON.stringify(quotes().filter(function(q){return q.id!==id})));renderJobs()}function waQ(id){var q=quotes().filter(function(x){return x.id===id})[0];if(q)window.open('https://wa.me/?text='+encodeURIComponent(msgFrom(q)))}function show(n,b){['quote','jobs','rates'].forEach(function(x){$('page-'+x).classList.toggle('hidden',x!==n)});document.querySelectorAll('nav button').forEach(function(x){x.classList.remove('active')});b.classList.add('active');if(n==='jobs')renderJobs();if(n==='rates')fillRates()}fillRates();calc();renderJobs();</script></body></html>
