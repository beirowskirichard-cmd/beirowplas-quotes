<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Beirowplas Ops</title>
<style>
:root{--bg:#071912;--card:#0f2c22;--c2:#14362b;--line:#1f4a3a;--t:#e8f5ef;--m:#9bb8ab;--a:#2ecc71;--gold:#d4af37;--warn:#e67e22}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--t);font-family:-apple-system,sans-serif;padding-bottom:84px}
header{position:sticky;top:0;background:#0b3d2e;padding:12px 14px;display:flex;justify-content:space-between;align-items:center}
header h1{margin:0;font-size:16px}header small{color:var(--m)}
.wrap{padding:12px}.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;margin-bottom:10px}
h2{margin:0 0 8px;font-size:15px}label{display:block;font-size:11px;color:var(--m);margin:8px 0 3px}
input,select,textarea{width:100%;background:#0a211a;color:var(--t);border:1px solid var(--line);border-radius:10px;padding:10px;font-size:16px}
.row{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.btn{width:100%;border:0;border-radius:11px;padding:11px;font-weight:700}
.btn-a{background:var(--a);color:#062016}.btn-g{background:var(--c2);color:var(--t);border:1px solid var(--line)}
.btn-r{background:#3a1a16;color:#f5c6c2}
.btns{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}
.kpi{display:grid;grid-template-columns:1fr 1fr;gap:8px}.kpi div{background:var(--c2);border-radius:10px;padding:10px}
.kpi span{display:block;font-size:11px;color:var(--m)}.kpi b{font-size:18px}
.item{background:var(--c2);border-radius:10px;padding:10px;margin-bottom:8px}
.tag{font-size:10px;padding:2px 7px;border-radius:99px;background:#1a4d38;color:var(--gold)}
.tag.done{background:#1a3d28;color:var(--a)}.tag.wait{background:#3d2a12;color:var(--warn)}
.hidden{display:none}nav{position:fixed;left:0;right:0;bottom:0;display:grid;grid-template-columns:repeat(4,1fr);background:#0a2a20}
nav button{background:none;border:0;color:var(--m);padding:12px 4px 16px;font-size:11px}nav button.on{color:var(--a);font-weight:700}
.note{font-size:12px;color:var(--m)}
</style></head><body>
<header><div><h1>Beirowplas Ops</h1><small id="who">Sign in</small></div>
<button class="btn btn-g" style="width:auto;padding:8px 10px" onclick="logout()">Out</button></header>
<section id="login" class="wrap"><div class="card"><h2>Company sign in</h2>
<p class="note">Driver, mechanic, admin, logistics, manager. Same jobs. Backup to keep phones and the office PC together.</p>
<label>Name</label><select id="uid"></select><label>PIN</label>
<input id="pin" type="password" inputmode="numeric" placeholder="1234"/>
<div class="btns"><button class="btn btn-a" onclick="login()">Sign in</button><button class="btn btn-g" onclick="seed()">Load demo</button></div>
<p class="note">Default PIN 1234.</p></div></section>
<section id="app" class="hidden"><div id="view" class="wrap"></div><nav id="nav"></nav></section>
<script>
var KEY='bp_ops_v1',S={users:[],jobs:[],trucks:[],work:[],quotes:[]},ME=null,TAB='home';
function load(){try{var x=JSON.parse(localStorage.getItem(KEY)||'');if(x&&x.users)S=x}catch(e){}}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
function money(n){return 'R '+Math.round(n||0).toLocaleString('en-ZA')}
function nid(){return Date.now()+Math.floor(Math.random()*99)}
function today(){return new Date().toISOString().slice(0,10)}
function seed(){S={users:[{id:1,name:'Richard',role:'manager',pin:'1234'},{id:2,name:'Office admin',role:'admin',pin:'1234'},{id:3,name:'Logistics',role:'logistics',pin:'1234'},{id:4,name:'Driver 1',role:'driver',pin:'1234'},{id:5,name:'Mechanic',role:'mechanic',pin:'1234'}],trucks:[{id:11,name:'FAW 1',reg:'CA 000-000',status:'ok',km:182000,nextService:190000},{id:12,name:'FAW 2',reg:'CA 111-111',status:'workshop',km:210400,nextService:210000}],jobs:[{id:21,client:'Breakwater Lodge',type:'recycling',km:60,hours:2.5,driverId:4,truckId:11,status:'dispatched',date:today(),note:'Swap every 5 days',charge:2988},{id:22,client:'RCL Worcester',type:'mortality',km:40,hours:3,driverId:4,truckId:11,status:'quoted',date:today(),note:'',charge:0}],work:[{id:31,truckId:12,status:'open',item:'Brakes / service overdue',by:'Mechanic'}],quotes:[]};save();fillUsers();alert('Demo loaded. PIN 1234.')}
function fillUsers(){load();if(!S.users.length)seed();document.getElementById('uid').innerHTML=S.users.map(function(u){return '<option value="'+u.id+'">'+u.name+' — '+u.role+'</option>'}).join('')}
function login(){load();var u=S.users.filter(function(x){return String(x.id)===document.getElementById('uid').value})[0];if(!u||u.pin!==document.getElementById('pin').value){alert('Wrong PIN');return}ME=u;document.getElementById('login').classList.add('hidden');document.getElementById('app').classList.remove('hidden');document.getElementById('who').textContent=u.name+' · '+u.role;TAB='home';draw()}
function logout(){ME=null;document.getElementById('app').classList.add('hidden');document.getElementById('login').classList.remove('hidden')}
var NAV={driver:[['home','Jobs'],['trip','Trip'],['truck','Truck'],['more','More']],mechanic:[['home','Workshop'],['fleet','Fleet'],['more','More']],admin:[['home','Quotes'],['jobs','Jobs'],['people','People'],['more','More']],logistics:[['home','Board'],['jobs','Jobs'],['fleet','Fleet'],['more','More']],manager:[['home','Desk'],['jobs','Jobs'],['fleet','Fleet'],['more','More']]};
function draw(){var n=NAV[ME.role]||NAV.manager;document.getElementById('nav').innerHTML=n.map(function(x){return '<button class="'+(TAB===x[0]?'on':'')+'" onclick="go(\''+x[0]+'\')">'+x[1]+'</button>'}).join('');var v=document.getElementById('view');if(TAB==='more')v.innerHTML=more();else if(ME.role==='driver')v.innerHTML=driverV();else if(ME.role==='mechanic')v.innerHTML=mechV();else if(ME.role==='admin')v.innerHTML=adminV();else if(ME.role==='logistics')v.innerHTML=logV();else v.innerHTML=manV()}
function go(t){TAB=t;draw()}
function jobBy(id){return S.jobs.filter(function(j){return j.id===id})[0]}
function userBy(id){return S.users.filter(function(u){return u.id===id})[0]||{name:'-'}}
function truckBy(id){return S.trucks.filter(function(t){return t.id===id})[0]||{name:'-'}}
function st(s){return '<span class="tag '+(s==='done'||s==='ok'?'done':(s==='quoted'||s==='open'||s==='workshop'?'wait':''))+' ">'+s+'</span>'}
function driverJobs(){return S.jobs.filter(function(j){return j.driverId===ME.id&&j.status!=='done'&&j.status!=='invoiced'})}
function driverV(){if(TAB==='trip'){var open=driverJobs();return '<div class="card"><h2>Trip</h2>'+(open[0]?'<p>'+open[0].client+'</p><label>Actual km</label><input id="akm" type="number" value="'+open[0].km+'"><label>Diesel litres</label><input id="alit" type="number" step="0.1"><label>Note</label><textarea id="anote"></textarea><div class="btns"><button class="btn btn-a" onclick="finish('+open[0].id+')">Finish</button><button class="btn btn-r" onclick="breakDown('+open[0].truckId+')">Breakdown</button></div>':'<p class="note">No open job.</p>')+'</div>'}if(TAB==='truck'){var t=S.trucks[0];return '<div class="card"><h2>Truck</h2><p><b>'+t.name+'</b> '+t.reg+'</p><p>'+st(t.status)+' '+t.km+' km</p></div>'}return '<div class="card"><h2>My jobs</h2>'+(driverJobs().length?driverJobs().map(function(j){return '<div class="item"><b>'+j.client+'</b> '+st(j.status)+'<br><small>'+j.type+' · '+j.km+' km</small><br><button class="btn btn-a" onclick="startJob('+j.id+')">Start</button></div>'}).join(''):'<p class="note">Nothing assigned.</p>')+'</div>'}
function startJob(id){var j=jobBy(id);if(!j)return;j.status='in-progress';save();TAB='trip';draw()}
function finish(id){var j=jobBy(id);if(!j)return;j.status='done';j.actualKm=parseFloat(document.getElementById('akm').value)||j.km;j.actualL=parseFloat(document.getElementById('alit').value)||0;save();TAB='home';draw();alert('Done')}
function breakDown(tid){S.work.unshift({id:nid(),truckId:tid,status:'open',item:'Breakdown by '+ME.name,by:ME.name});var t=truckBy(tid);if(t.id)t.status='workshop';save();alert('Mechanic notified');draw()}
function mechV(){if(TAB==='fleet')return fleetCard();var open=S.work.filter(function(w){return w.status!=='done'});return '<div class="card"><h2>Workshop</h2>'+(open.length?open.map(function(w){return '<div class="item"><b>'+truckBy(w.truckId).name+'</b> '+st(w.status)+'<p>'+w.item+'</p><button class="btn btn-a" onclick="fixW('+w.id+')">Mark done</button></div>'}).join(''):'<p class="note">No open jobs</p>')+'<label>Truck</label><select id="wt">'+S.trucks.map(function(t){return '<option value="'+t.id+'">'+t.name+'</option>'}).join('')+'</select><label>Work</label><textarea id="wi"></textarea><button class="btn btn-a" onclick="addW()">Add job card</button></div>'}
function addW(){var tid=parseInt(document.getElementById('wt').value,10);S.work.unshift({id:nid(),truckId:tid,status:'open',item:document.getElementById('wi').value||'Service',by:ME.name});var t=truckBy(tid);if(t.id)t.status='workshop';save();draw()}
function fixW(wid){S.work.forEach(function(w){if(w.id===wid)w.status='done'});var w=S.work.filter(function(x){return x.id===wid})[0];var t=truckBy(w&&w.truckId);if(t.id)t.status='ok';save();draw()}
function fleetCard(){return '<div class="card"><h2>Fleet</h2>'+S.trucks.map(function(t){return '<div class="item"><b>'+t.name+'</b> '+t.reg+' '+st(t.status)+(t.km>=t.nextService?' <span class="tag wait">service due</span>':'')+'<br><small>'+t.km+' km</small></div>'}).join('')+'</div>'}
function adminV(){if(TAB==='jobs')return jobsList(true);if(TAB==='people')return people();return '<div class="card"><h2>New job</h2><label>Client</label><input id="qc"><div class="row"><div><label>Type</label><select id="qt"><option>recycling</option><option>mortality</option><option>general</option></select></div><div><label>km</label><input id="qkm" type="number" value="60"></div></div><div class="row"><div><label>Hours</label><input id="qh" type="number" value="2.5"></div><div><label>Charge excl VAT</label><input id="qch" type="number" value="2988"></div></div><label>Notes</label><textarea id="qn"></textarea><button class="btn btn-a" onclick="addQuoteJob()">Save quoted job</button></div>'+jobsList(false)}
function addQuoteJob(){S.jobs.unshift({id:nid(),client:document.getElementById('qc').value||'Client',type:document.getElementById('qt').value,km:parseFloat(document.getElementById('qkm').value)||0,hours:parseFloat(document.getElementById('qh').value)||0,driverId:0,truckId:0,status:'quoted',date:today(),note:document.getElementById('qn').value,charge:parseFloat(document.getElementById('qch').value)||0});save();draw()}
function jobsList(assign){return '<div class="card"><h2>Jobs</h2>'+S.jobs.map(function(j){return '<div class="item"><b>'+j.client+'</b> '+st(j.status)+'<br><small>'+j.type+' · '+j.km+' km · '+userBy(j.driverId).name+' · '+truckBy(j.truckId).name+'</small>'+(assign?'<div class="row" style="margin-top:8px"><select id="d'+j.id+'">'+S.users.filter(function(u){return u.role==='driver'}).map(function(u){return '<option value="'+u.id+'" '+(u.id===j.driverId?'selected':'')+'>'+u.name+'</option>'}).join('')+'</select><select id="t'+j.id+'">'+S.trucks.map(function(t){return '<option value="'+t.id+'" '+(t.id===j.truckId?'selected':'')+'>'+t.name+'</option>'}).join('')+'</select></div><button class="btn btn-a" style="margin-top:6px" onclick="dispatch('+j.id+')">Dispatch</button>':'')+(ME.role==='admin'&&j.status==='done'?'<button class="btn btn-g" style="margin-top:6px" onclick="invoice('+j.id+')">Invoiced</button>':'')+'</div>'}).join('')+'</div>'}
function dispatch(jid){var j=jobBy(jid);if(!j)return;j.driverId=parseInt(document.getElementById('d'+jid).value,10);j.truckId=parseInt(document.getElementById('t'+jid).value,10);j.status='dispatched';save();draw()}
function invoice(jid){var j=jobBy(jid);if(!j)return;j.status='invoiced';save();draw()}
function people(){return '<div class="card"><h2>People</h2>'+S.users.map(function(u){return '<div class="item"><b>'+u.name+'</b> '+u.role+'</div>'}).join('')+'<label>Name</label><input id="nn"><label>Role</label><select id="nr"><option>driver</option><option>mechanic</option><option>admin</option><option>logistics</option><option>manager</option></select><label>PIN</label><input id="np" value="1234"><button class="btn btn-a" onclick="addUser()">Add person</button></div>'}
function addUser(){S.users.push({id:nid(),name:document.getElementById('nn').value||'User',role:document.getElementById('nr').value,pin:document.getElementById('np').value||'1234'});save();draw()}
function logV(){if(TAB==='jobs')return jobsList(true);if(TAB==='fleet')return fleetCard();return '<div class="card"><h2>Board</h2><p class="note">On the road: '+S.jobs.filter(function(j){return j.status==='dispatched'||j.status==='in-progress'}).length+'</p></div>'+jobsList(true)}
function manV(){if(TAB==='jobs')return jobsList(true);if(TAB==='fleet')return fleetCard();var rev=S.jobs.filter(function(j){return j.status==='done'||j.status==='invoiced'}).reduce(function(a,j){return a+(j.charge||0)},0);return '<div class="card"><h2>Desk</h2><div class="kpi"><div><span>Jobs today</span><b>'+S.jobs.filter(function(j){return j.date===today()}).length+'</b></div><div><span>Done revenue</span><b>'+money(rev)+'</b></div><div><span>Workshop</span><b>'+S.work.filter(function(w){return w.status!=='done'}).length+'</b></div><div><span>Trucks</span><b>'+S.trucks.length+'</b></div></div></div>'+jobsList(false)}
function more(){return '<div class="card"><h2>Backup</h2><p class="note">Office PC backups. Phones restore the same file so everyone sees the same jobs.</p><div class="btns"><button class="btn btn-a" onclick="exp()">Backup file</button><button class="btn btn-g" onclick="document.getElementById(\x27imp\x27).click()">Restore</button></div><input id="imp" type="file" class="hidden" accept="application/json" onchange="imp(event)"></div>'}
function exp(){var a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(S,null,2)],{type:'application/json'}));a.download='beirowplas-ops.json';a.click()}
function imp(ev){var f=ev.target.files[0];if(!f)return;var r=new FileReader();r.onload=function(){try{S=JSON.parse(r.result);save();alert('Restored');draw()}catch(e){alert('Bad file')}};r.readAsText(f)}
fillUsers();
</script></body></html>
