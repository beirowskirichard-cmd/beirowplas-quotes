<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/><title>Beirowplas Ops</title>
<style>:root{--bg:#071912;--card:#0f2c22;--c2:#14362b;--line:#1f4a3a;--t:#e8f5ef;--m:#9bb8ab;--a:#2ecc71;--gold:#d4af37}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--t);font-family:-apple-system,sans-serif;padding-bottom:84px}header{position:sticky;top:0;background:#0b3d2e;padding:12px 14px;display:flex;justify-content:space-between;align-items:center}header h1{margin:0;font-size:16px}header small{color:var(--m)}.wrap{padding:12px}.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;margin-bottom:10px}h2{margin:0 0 8px;font-size:15px}label{display:block;font-size:11px;color:var(--m);margin:8px 0 3px}input,select,textarea{width:100%;background:#0a211a;color:var(--t);border:1px solid var(--line);border-radius:10px;padding:10px;font-size:16px}.row{display:grid;grid-template-columns:1fr 1fr;gap:8px}.btn{width:100%;border:0;border-radius:11px;padding:11px;font-weight:700}.btn-a{background:var(--a);color:#062016}.btn-g{background:var(--c2);color:var(--t);border:1px solid var(--line)}.btn-r{background:#3a1a16;color:#f5c6c2}.btns{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}.item{background:var(--c2);border-radius:10px;padding:10px;margin-bottom:8px}.tag{font-size:10px;padding:2px 7px;border-radius:99px;background:#1a4d38;color:var(--gold)}.hidden{display:none}nav{position:fixed;left:0;right:0;bottom:0;display:grid;grid-template-columns:repeat(4,1fr);background:#0a2a20}nav button{background:none;border:0;color:var(--m);padding:12px 4px 16px;font-size:11px}nav button.on{color:var(--a);font-weight:700}.note{font-size:12px;color:var(--m)}#sig{width:100%;height:140px;background:#fff;border-radius:10px;touch-action:none}img.tick{max-width:100%;border-radius:8px;margin-top:6px}</style></head><body>
<header><div><h1>Beirowplas Ops</h1><small id="who">Sign in</small></div><button class="btn btn-g" style="width:auto;padding:8px 10px" onclick="logout()">Out</button></header>
<section id="login" class="wrap"><div class="card"><h2>Sign in</h2><label>Name</label><select id="uid"></select><label>PIN</label><input id="pin" type="password" value="1234"/><div class="btns"><button class="btn btn-a" onclick="login()">Sign in</button><button class="btn btn-g" onclick="seed()">Load demo</button></div></div></section>
<section id="app" class="hidden"><div id="view" class="wrap"></div><nav id="nav"></nav></section>
<script>
var KEY='bp_ops_v1',S={users:[],jobs:[],trucks:[],work:[]},ME=null,TAB='home',FILES={};
function load(){try{var x=JSON.parse(localStorage.getItem(KEY)||'');if(x&&x.users)S=x}catch(e){}}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){alert('Storage full — backup then remove old jobs')}}
function nid(){return Date.now()}function today(){return new Date().toISOString().slice(0,10)}
function seed(){S={users:[{id:1,name:'Richard',role:'manager',pin:'1234'},{id:2,name:'Office admin',role:'admin',pin:'1234'},{id:3,name:'Logistics',role:'logistics',pin:'1234'},{id:4,name:'Driver 1',role:'driver',pin:'1234'},{id:5,name:'Mechanic',role:'mechanic',pin:'1234'}],trucks:[{id:11,name:'FAW 1',reg:'CA 000-000',status:'ok',km:182000,nextService:190000},{id:12,name:'FAW 2',reg:'CA 111-111',status:'ok',km:210000,nextService:210000}],jobs:[{id:21,client:'Breakwater Lodge',type:'recycling',km:60,hours:2.5,driverId:4,truckId:11,status:'dispatched',date:today(),note:'',charge:2988}],work:[]};save();fillUsers();alert('Demo loaded')}
function fillUsers(){load();if(!S.users.length)seed();document.getElementById('uid').innerHTML=S.users.map(function(u){return '<option value="'+u.id+'">'+u.name+' — '+u.role+'</option>'}).join('')}
function login(){load();var u=S.users.filter(function(x){return String(x.id)===document.getElementById('uid').value})[0];if(!u||u.pin!==document.getElementById('pin').value){alert('Wrong PIN');return}ME=u;document.getElementById('login').classList.add('hidden');document.getElementById('app').classList.remove('hidden');document.getElementById('who').textContent=u.name+' · '+u.role;TAB='home';draw()}
function logout(){ME=null;document.getElementById('app').classList.add('hidden');document.getElementById('login').classList.remove('hidden')}
var NAV={driver:[['home','Jobs'],['trip','DN'],['truck','Truck'],['more','More']],mechanic:[['home','Workshop'],['fleet','Fleet'],['more','More']],admin:[['home','Jobs'],['people','People'],['more','More']],logistics:[['home','Board'],['fleet','Fleet'],['more','More']],manager:[['home','Desk'],['jobs','Jobs'],['fleet','Fleet'],['more','More']]};
function draw(){var n=NAV[ME.role]||NAV.manager;document.getElementById('nav').innerHTML=n.map(function(x){return '<button class="'+(TAB===x[0]?'on':'')+'" onclick="go(\''+x[0]+'\')">'+x[1]+'</button>'}).join('');var v=document.getElementById('view');if(TAB==='more')v.innerHTML=more();else if(ME.role==='driver')v.innerHTML=driverV();else if(ME.role==='mechanic')v.innerHTML=mechV();else if(ME.role==='admin')v.innerHTML=TAB==='people'?people():jobsList(true);else if(ME.role==='logistics')v.innerHTML=TAB==='fleet'?fleetCard():jobsList(true);else v.innerHTML=manV();if(document.getElementById('sig'))initSig()}
function go(t){TAB=t;draw()}
function jobBy(i){return S.jobs.filter(function(j){return j.id===i})[0]}
function userBy(i){return S.users.filter(function(u){return u.id===i})[0]||{name:'-'}}
function truckBy(i){return S.trucks.filter(function(t){return t.id===i})[0]||{name:'-',reg:''}}
function st(s){return '<span class="tag">'+s+'</span>'}
function driverJobs(){return S.jobs.filter(function(j){return j.driverId===ME.id&&j.status!=='done'&&j.status!=='invoiced'})}
function gv(i){var e=document.getElementById(i);return e?e.value:''}
function pickFile(inp,key,prev){var f=document.getElementById(inp).files[0];if(!f)return;if(f.size>8*1024*1024){alert('Max 8MB');return}var r=new FileReader();r.onload=function(){if(f.type.indexOf('image/')===0){var img=new Image();img.onload=function(){var c=document.createElement('canvas'),w=img.width,h=img.height,m=1280;if(w>m){h=h*m/w;w=m}c.width=w;c.height=h;c.getContext('2d').drawImage(img,0,0,w,h);FILES[key]={name:f.name,type:'image/jpeg',data:c.toDataURL('image/jpeg',0.7)};document.getElementById(prev).innerHTML='<img class="tick" src="'+FILES[key].data+'">' };img.src=r.result}else{FILES[key]={name:f.name,type:f.type||'application/pdf',data:r.result};document.getElementById(prev).textContent='PDF: '+f.name}};r.readAsDataURL(f)}
function fileLink(f,label){if(!f||!f.data)return '';if((f.type||'').indexOf('image/')===0)return '<div class="note">'+label+'</div><img class="tick" src="'+f.data+'">';return '<a class="btn btn-g" style="display:block;margin-top:6px;text-align:center" href="'+f.data+'" download="'+(f.name||label)+'">'+label+'</a>'}
function driverV(){if(TAB==='trip'){var o=driverJobs()[0],t=o?truckBy(o.truckId):{};return '<div class="card"><h2>Delivery note</h2>'+(o?dnForm(o,t):'<p class="note">Open a job first.</p>')+'</div>'}if(TAB==='truck')return '<div class="card"><h2>Truck</h2><p>'+S.trucks[0].name+' '+S.trucks[0].reg+'</p></div>';return '<div class="card"><h2>My jobs</h2>'+(driverJobs().length?driverJobs().map(function(j){return '<div class="item"><b>'+j.client+'</b> '+st(j.status)+'<br><button class="btn btn-a" onclick="startJob('+j.id+')">Open DN</button></div>'}).join(''):'<p class="note">Nothing assigned</p>')+'</div>'}
function dnForm(o,t){return '<label>Name</label><input id="dnName" value="'+(o.client||'')+'"><div class="row"><div><label>DN nr</label><input id="dnNr"></div><div><label>Date</label><input id="dnDate" type="date" value="'+today()+'"></div></div><div class="row"><div><label>GRA nr</label><input id="dnGra"></div><div><label>Weighbridge nr</label><input id="dnWb"></div></div><div class="row"><div><label>Weight kg</label><input id="dnWt" type="number" step="0.01"></div><div><label>Person signed</label><input id="dnWho"></div></div><div class="row"><div><label>Driver name</label><input id="dnDrv" value="'+(ME.name||'')+'"></div><div><label>Truck reg</label><input id="dnReg" value="'+(t.reg||'')+'"></div></div><label>GRA ticket photo or PDF</label><input id="fGra" type="file" accept="image/*,application/pdf" onchange="pickFile(\x27fGra\x27,\x27graFile\x27,\x27pGra\x27)"><div id="pGra"></div><label>Weighbridge ticket photo or PDF</label><input id="fWb" type="file" accept="image/*,application/pdf" onchange="pickFile(\x27fWb\x27,\x27wbFile\x27,\x27pWb\x27)"><div id="pWb"></div><label>Extra photo or PDF</label><input id="fEx" type="file" accept="image/*,application/pdf" onchange="pickFile(\x27fEx\x27,\x27exFile\x27,\x27pEx\x27)"><div id="pEx"></div><label>Signature</label><canvas id="sig"></canvas><button class="btn btn-g" style="margin-top:6px" onclick="clearSig()">Clear</button><label>Note</label><textarea id="anote"></textarea><div class="btns"><button class="btn btn-a" onclick="finish('+o.id+')">Save DN</button><button class="btn btn-r" onclick="breakDown('+o.truckId+')">Breakdown</button></div>'}
function initSig(){var c=document.getElementById('sig');if(!c)return;var x=c.getContext('2d');c.width=c.offsetWidth||300;c.height=140;x.strokeStyle='#111';x.lineWidth=2;var d=false,last=null;function pos(e){var r=c.getBoundingClientRect();var p=e.touches?e.touches[0]:e;return{x:p.clientX-r.left,y:p.clientY-r.top}}function start(e){d=true;last=pos(e);e.preventDefault()}function move(e){if(!d)return;var p=pos(e);x.beginPath();x.moveTo(last.x,last.y);x.lineTo(p.x,p.y);x.stroke();last=p;e.preventDefault()}function end(){d=false}c.onmousedown=start;c.onmousemove=move;c.onmouseup=end;c.onmouseleave=end;c.ontouchstart=start;c.ontouchmove=move;c.ontouchend=end}
function clearSig(){var c=document.getElementById('sig');if(c)c.getContext('2d').clearRect(0,0,c.width,c.height)}
function startJob(id){var j=jobBy(id);j.status='in-progress';save();TAB='trip';FILES={};draw()}
function finish(id){var j=jobBy(id);if(!gv('dnNr')){alert('DN number required');return}if(!gv('dnWt')){alert('Weight required');return}j.dn={name:gv('dnName'),dnNr:gv('dnNr'),date:gv('dnDate'),gra:gv('dnGra'),weighbridge:gv('dnWb'),weight:parseFloat(gv('dnWt'))||0,signedBy:gv('dnWho'),driver:gv('dnDrv'),truckReg:gv('dnReg'),note:gv('anote'),signature:(document.getElementById('sig')||{toDataURL:function(){return ''}}).toDataURL(),graFile:FILES.graFile||null,wbFile:FILES.wbFile||null,extraFile:FILES.exFile||null};j.status='done';FILES={};save();TAB='home';draw();alert('DN + tickets saved')}
function breakDown(tid){S.work.unshift({id:nid(),truckId:tid,status:'open',item:'Breakdown '+ME.name,by:ME.name});save();alert('Mechanic notified');draw()}
function mechV(){return '<div class="card"><h2>Workshop</h2>'+S.work.filter(function(w){return w.status!=='done'}).map(function(w){return '<div class="item"><b>'+truckBy(w.truckId).name+'</b><p>'+w.item+'</p></div>'}).join('')+'</div>'}
function fleetCard(){return '<div class="card"><h2>Fleet</h2>'+S.trucks.map(function(t){return '<div class="item"><b>'+t.name+'</b> '+t.reg+'</div>'}).join('')+'</div>'}
function people(){return '<div class="card"><h2>People</h2>'+S.users.map(function(u){return '<div class="item"><b>'+u.name+'</b> '+u.role+'</div>'}).join('')+'<label>Name</label><input id="nn"><label>Role</label><select id="nr"><option>driver</option><option>admin</option><option>logistics</option><option>mechanic</option><option>manager</option></select><label>PIN</label><input id="np" value="1234"><button class="btn btn-a" onclick="addUser()">Add</button></div>'}
function addUser(){S.users.push({id:nid(),name:gv('nn')||'User',role:gv('nr'),pin:gv('np')||'1234'});save();draw()}
function jobsList(assign){return '<div class="card"><h2>Jobs</h2>'+S.jobs.map(function(j){return '<div class="item"><b>'+j.client+'</b> '+st(j.status)+(j.dn?'<p class="note">DN '+j.dn.dnNr+' · GRA '+j.dn.gra+' · WB '+j.dn.weighbridge+' · '+j.dn.weight+' kg<br>'+j.dn.driver+' · '+j.dn.truckReg+' · signed '+j.dn.signedBy+'</p>'+fileLink(j.dn.graFile,'GRA ticket')+fileLink(j.dn.wbFile,'Weighbridge ticket')+fileLink(j.dn.extraFile,'Extra')+(j.dn.signature?'<div class="note">Signature</div><img class="tick" style="background:#fff" src="'+j.dn.signature+'">':''):'')+(assign?'<div class="row" style="margin-top:8px"><select id="d'+j.id+'">'+S.users.filter(function(u){return u.role==='driver'}).map(function(u){return '<option value="'+u.id+'">'+u.name+'</option>'}).join('')+'</select><select id="t'+j.id+'">'+S.trucks.map(function(t){return '<option value="'+t.id+'">'+t.name+'</option>'}).join('')+'</select></div><button class="btn btn-a" style="margin-top:6px" onclick="dispatch('+j.id+')">Dispatch</button>':'')+'</div>'}).join('')+'</div>'}
function dispatch(id){var j=jobBy(id);j.driverId=+document.getElementById('d'+id).value;j.truckId=+document.getElementById('t'+id).value;j.status='dispatched';save();draw()}
function manV(){if(TAB==='jobs')return jobsList(false);if(TAB==='fleet')return fleetCard();return '<div class="card"><h2>Desk</h2><p class="note">DNs with tickets: '+S.jobs.filter(function(j){return j.dn}).length+'</p></div>'+jobsList(false)}
function more(){return '<div class="card"><h2>Backup</h2><div class="btns"><button class="btn btn-a" onclick="exp()">Backup</button><button class="btn btn-g" onclick="document.getElementById(\x27imp\x27).click()">Restore</button></div><input id="imp" type="file" class="hidden" onchange="imp(event)"></div>'}
function exp(){var a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(S)],{type:'application/json'}));a.download='beirowplas-ops.json';a.click()}
function imp(ev){var f=ev.target.files[0];if(!f)return;var r=new FileReader();r.onload=function(){S=JSON.parse(r.result);save();draw()};r.readAsText(f)}
fillUsers();
</script></body></html>
